<h2>Gerenciamento de Produtos</h2>

@for (produto of produtos(); track produto.id) {
  <div class="card">
    <h3>{{ produto.nome }}</h3>
    <p>Estoque: {{ produto.estoque }}</p>
    <p>Preco: {{ produto.preco | currency: 'BRL' }}</p>

    <label [for]="'preco-' + produto.id">Novo preco:</label>
    <input
      [id]="'preco-' + produto.id"
      type="number"
      [value]="produto.preco"
      (input)="atualizarPreco(produto.id, $event)"
    />

    <label [for]="'estoque-' + produto.id">Novo estoque:</label>
    <input
      [id]="'estoque-' + produto.id"
      type="number"
      [value]="produto.estoque"
      (input)="atualizarEstoque(produto.id, $event)"
    />
  </div>
}
